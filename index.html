<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mostros Mix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600;700&family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Layout: pantalla fija tipo juego. Celular: libreta arriba (menú flotante adentro) + tira de partes y carrusel abajo. Pantalla ancha: libreta a la izquierda y panel de partes a la derecha */
:root{
  --kraft:#cfcabe;
  --paper:#e9e4d8;
  --ink:#24213a;
  --ink-soft:#67627a;
  --rule:#b7b1a4;
  --sun:#f0cf55;
  --berry:#c8553d;
  --wa:#8fd3a0;
  --display:"Alfa Slab One","Rockwell","Georgia",serif;
  --script:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--kraft);color:var(--ink)}
body{margin:0;overflow:hidden;font-family:var(--hand);font-size:18px;line-height:1.25;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 13%,transparent) 1.2px,transparent 1.4px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--berry);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.burger{position:absolute;z-index:41;top:10px;right:10px;width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.burger svg{width:24px;height:24px}
.burger[aria-expanded="true"]{background:var(--sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

.menu{position:absolute;z-index:40;top:60px;right:10px;
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:240px}
.mi{display:flex;align-items:center;gap:12px;text-align:left;font-size:21px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;background:#fffaf0}
.mi svg{width:26px;height:26px;flex:none}
.mi[aria-pressed="true"]{background:var(--sun)}
.mi .st{margin-left:auto;font-size:16px;color:var(--ink-soft)}
.tools{position:absolute;z-index:39;top:10px;left:10px;display:flex;flex-direction:row;gap:8px}
.tool{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--sun)}
.scrim{position:fixed;inset:0;z-index:35;background:transparent}

.page{flex:1;min-height:0;position:relative;margin-top:18px;background:var(--paper);border:3px solid var(--ink);border-radius:8px;
  box-shadow:5px 5px 0 var(--ink);padding:20px 8px 8px;display:flex;flex-direction:column}
.rings{position:absolute;top:-15px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}
.rings i{width:10px;height:26px;border:3px solid var(--ink);border-radius:8px}

.cover{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding-inline:6px;padding-top:40px;min-height:46px;justify-content:center;min-width:0;max-width:100%}
.line1{display:flex;align-items:baseline;justify-content:center;gap:8px;white-space:nowrap;font-family:var(--display);font-size:22px;line-height:1.1;
  color:var(--tfill,var(--paper));-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;border-bottom:1px solid var(--rule);padding-inline:10px}
.line1 .las{font-size:.72em;letter-spacing:.12em}
.line1 .del{font-family:var(--script);font-weight:700;font-size:1.15em;color:var(--ink);-webkit-text-stroke:0;transform:rotate(-3deg);display:inline-block}
.ttl{display:inline-block}
.ttl span{display:inline-block}
.namebox{display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;width:100%;min-width:0}
#tName{flex:0 1 auto;min-width:0;max-width:none;white-space:nowrap;overflow:hidden;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.15;
  color:var(--tfill,var(--paper));-webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill;text-shadow:-1.4px 1.1px 0 color-mix(in srgb,var(--ink) 30%,transparent);padding-inline:2px}
.cover.rb .line1,.cover.rb #tName{background:linear-gradient(90deg,#e8a0a0,#ecc58a,#e6dc8e,#b3d39a,#a6cbe0,#c4b0dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.pencil{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);padding:0}
.pencil svg{width:20px;height:20px}
.nameform{display:flex;gap:8px;width:100%;margin-block:4px}
.nameform input{flex:1;min-width:0;font-family:var(--display);font-size:22px;padding:6px 10px;border:3px solid var(--ink);border-radius:12px;background:#fffaf0;color:var(--ink)}
.nameform .cnt{align-self:center;font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
.nameform .cnt.full{color:var(--berry);font-weight:700}
.nameform button{border:3px solid var(--ink);border-radius:12px;background:var(--sun);font-family:var(--display);font-size:18px;padding:0 14px}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage svg{width:100%;height:100%;overflow:visible}
/* solo se anima el mostro grande, como capa ya dibujada (el filtro de lapicera no se recalcula en cada cuadro) */
.stage>svg{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 92%;will-change:transform}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1deg)}}
.stage.pop>svg{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.75,1.18)}60%{transform:scale(1.1,.92)}100%{transform:scale(1)}}
.stage.shake>svg{animation:shake .14s linear infinite}
@keyframes shake{25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}

.actions{flex:none;display:flex;align-items:center;justify-content:center;gap:22px;padding-top:4px}
.round{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;padding:0;color:var(--ink);text-decoration:none}
.round svg{width:30px;height:30px}
.round:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#rand{width:78px;height:78px;background:var(--sun);box-shadow:4px 4px 0 var(--ink)}
#rand svg{width:42px;height:42px}
.wa{background:var(--wa)}
.sharebox{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(36,33,58,.35);padding:16px}
.sb-card{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:18px 18px 16px;display:grid;gap:10px;width:min(300px,100%)}
.sb-t{margin:0 0 4px;font-family:var(--display);font-size:24px;text-align:center}
.sb-btn{display:block;text-align:center;text-decoration:none;color:var(--ink);font:inherit;font-size:18px;padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fffaf0;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.sb-wa{background:var(--wa)}
.sb-x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink)}

.picker{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px 2px;scroll-snap-type:x proximity;scrollbar-width:none}
.tabs::-webkit-scrollbar,.opts::-webkit-scrollbar{display:none}
.tab{flex:none;width:70px;scroll-snap-align:start;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:3px 2px 2px;
  display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:2px 2px 0 var(--ink);font-size:15px;line-height:1.1}
.tab svg{width:100%;height:34px}
.tab[aria-selected="true"]{background:var(--sun)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);margin:2px 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.opts{display:flex;gap:10px;overflow-x:auto;padding:6px 4px 10px 2px;scroll-snap-type:x proximity;scrollbar-width:none}
.opt{flex:none;width:94px;scroll-snap-align:start;position:relative;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:4px 3px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;line-height:1.05;text-align:center;box-shadow:2px 2px 0 var(--ink)}
.opt svg{width:100%;height:66px}
.opt span{min-height:2.1em;display:flex;align-items:center}
.opt[aria-pressed="true"]{background:#fffaf0;border-color:var(--berry);box-shadow:2px 2px 0 var(--ink)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;border:2px solid var(--ink);font-family:var(--display);font-size:13px;display:grid;place-items:center}

.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:color-mix(in srgb,var(--ink) 50%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);width:100%;max-width:560px;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.pill{border:3px solid var(--ink);background:#fffaf0;border-radius:40px;padding:5px 14px;box-shadow:2px 2px 0 var(--ink);font-size:17px;flex:none}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.preset{border:3px solid var(--ink);border-radius:12px;background:#fffaf0;padding:4px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:2px 2px 0 var(--ink);font-size:15px;line-height:1.1;text-align:center}
.preset svg{width:100%;height:96px}
.preset small{font-size:12px;color:var(--ink-soft)}
.info{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink);background:var(--sun)}
.leg-intro{margin:0;color:var(--ink-soft);font-size:17px}
.legends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.legend{border:3px solid var(--ink);border-radius:12px;background:#fffaf0;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:2px 2px 0 var(--ink);text-align:center;line-height:1.1}
.legend svg{width:100%;height:110px}
.legend b{font-family:var(--display);font-weight:400;font-size:18px}
.legend small{font-size:14px;color:var(--ink-soft)}
.ficha{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ficha-art{background:var(--paper);border-radius:10px}
.ficha-art svg{width:100%;height:200px}
.ficha-body{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ficha-body h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05}
.ficha-myth{margin:0;font-family:var(--script);font-weight:700;font-size:24px;line-height:1}
.ficha-origin{margin:0;display:flex;align-items:center;gap:6px;font-size:17px;color:var(--ink-soft)}
.ficha-origin svg{width:20px;height:20px;flex:none}
.ficha-text{margin:4px 0 6px;font-size:20px;line-height:1.3;max-width:42ch}
#fichaClose{background:var(--sun);font-size:19px}
@media (min-width:640px){ .legends{grid-template-columns:repeat(4,minmax(0,1fr))} .ficha{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center} }
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-top:8px}
.mini{position:relative;border:3px solid var(--ink);border-radius:12px;background:#fffaf0;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:14px;line-height:1.05;text-align:center;min-width:0}
.mini > button:first-child{border:0;background:none;padding:0;width:100%}
.mini svg{width:100%;height:96px}
.mini span{overflow-wrap:anywhere}
.mini .del{position:absolute;top:-10px;right:-8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:15px;line-height:1;padding:0}
.empty{grid-column:1/-1;color:var(--ink-soft);margin:0}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:30px;padding:10px 18px;font-size:18px;white-space:nowrap}

@media (min-width:900px){
  .app{max-width:1240px;flex-direction:row;gap:26px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
  .page{flex:1 1 52%;min-width:0;padding:26px 14px 14px}
  .cover{padding-inline:10px;padding-top:36px}
  .line1{font-size:28px}
  #rand{width:88px;height:88px} #rand svg{width:48px;height:48px}
  .round{width:64px;height:64px}
  .picker{flex:1 1 48%;min-width:0;min-height:0;margin-top:18px;padding-top:0;overflow-y:auto;gap:14px;padding-right:6px}
  .sheet{place-items:center}
  .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;gap:10px;padding:2px 4px 4px 2px}
  .tab{width:auto;font-size:18px;padding:6px 4px 4px;box-shadow:3px 3px 0 var(--ink)}
  .tab svg{height:52px}
  .sw{width:44px;height:44px}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));overflow:visible;gap:12px;padding:8px 6px 12px 2px}
  .opt{width:auto;font-size:17px;padding:6px 4px;box-shadow:3px 3px 0 var(--ink)}
  .opt svg{height:96px}
  .opt[aria-pressed="true"]::after{width:30px;height:30px;font-size:16px;top:-10px;right:-8px}
}
@media (max-height:700px){ .opt svg{height:54px} .tab svg{height:28px} #rand{width:66px;height:66px} .round{width:50px;height:50px} #tName{font-size:34px} }
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:flex!important;flex-direction:column;align-items:center;gap:6mm;color:#24213a}
  #printArea .p-name{font-family:var(--display);font-size:40pt;line-height:1.1;text-align:center;margin:0}
  #printArea svg{width:100%;height:auto;max-height:225mm}
  #printArea .bob{animation:none!important}
  #printArea .p-foot{font-family:var(--script);font-size:14pt;margin:0}
}
@media (prefers-reduced-motion:reduce){.stage>svg,.stage.pop>svg,.stage.shake>svg{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="wob2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
    <filter id="mono" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="table" tableValues="0 0.07 0.72 0.9 0.94 0.96"/><feFuncG type="table" tableValues="0 0.07 0.7 0.88 0.92 0.94"/><feFuncB type="table" tableValues="0 0.1 0.66 0.83 0.87 0.89"/></feComponentTransfer>
    </filter>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.6" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="9" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.22 0" result="gg"/>
      <feComposite in="gg" in2="d" operator="in" result="gr"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="gr"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <section class="page" aria-label="Tu mostro">
    <button class="burger" id="burger" aria-label="Menú" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6 H21 M3 12 H21 M3 18 H21" stroke="#24213a" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
    <nav class="menu" id="menu" hidden aria-label="Menú">
    <button class="mi" id="presetsBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2" fill="#f0cf55" stroke="#24213a" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#a6cbe0" stroke="#24213a" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#e8b0c0" stroke="#24213a" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#b9c98f" stroke="#24213a" stroke-width="1.8"/></svg>Mostros clásicos</button>
    <button class="mi" id="legBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 8.6 L21.6 9 L16.2 13.5 L18 20.4 L12 16.6 L6 20.4 L7.8 13.5 L2.4 9 L9.4 8.6 Z" fill="#f0cf55" stroke="#24213a" stroke-width="1.6" stroke-linejoin="round"/></svg>Mostros mitológicos</button>
    <button class="mi" id="printBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="6" fill="#fffaf0" stroke="#24213a" stroke-width="1.8"/><rect x="3" y="9" width="18" height="8" rx="2" fill="#a6cbe0" stroke="#24213a" stroke-width="1.8"/><rect x="7" y="14" width="10" height="7" fill="#fffaf0" stroke="#24213a" stroke-width="1.8"/></svg>Imprimir / PDF</button>
    <button class="mi" id="collBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 C5 15 2 11 4 7 C6 3 10 4 12 7 C14 4 18 3 20 7 C22 11 19 15 12 20Z" fill="#c8553d" stroke="#24213a" stroke-width="1.8" stroke-linejoin="round"/></svg>Mi colección</button>
  </nav>
    <div class="tools">
      <button class="tool" id="sound" aria-pressed="true" aria-label="Sonido"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#fffaf0" stroke="#24213a" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9 Q18 12 16 15 M18.5 7 Q22 12 18.5 17" fill="none" stroke="#24213a" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="tool" id="labels" aria-pressed="false" aria-label="Características"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4 H12 L21 13 L13 21 L3 11 Z" fill="#fffaf0" stroke="#24213a" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.8" fill="#24213a"/></svg></button>
      <button class="tool" id="editName" aria-label="Cambiar el nombre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 L5 15 L16 4 L20 8 L9 19 Z M14 6 L18 10" fill="#f0cf55" stroke="#24213a" stroke-width="1.8" stroke-linejoin="round"/></svg></button><button class="tool info" id="infoBtn" hidden aria-label="¿Quién es este mostro?">i</button>
    </div>
    <div class="rings" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="cover" aria-live="polite">
      <div class="namebox" id="nameBox"><div id="tName">Cornio</div></div>
      <form class="nameform" id="nameForm" hidden><input id="nameInput" maxlength="20" autocomplete="off" aria-label="Nombre del mostro (hasta 20 letras)" aria-describedby="nameCnt"><span class="cnt" id="nameCnt">0/20</span><button type="submit">Listo</button></form>
    </div>

function arrowPath(x1,y1,x2,y2){
  const cx=(x1+x2)/2+(y2-y1)*.22, cy=(y1+y2)/2-(x2-x1)*.12;
  const ang=Math.atan2(y2-cy,x2-cx), L=10, sp=.45;
  const h1=[x2-L*Math.cos(ang-sp), y2-L*Math.sin(ang-sp)], h2=[x2-L*Math.cos(ang+sp), y2-L*Math.sin(ang+sp)];
  return `M${x1},${y1} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2},${y2} M${h1[0].toFixed(1)},${h1[1].toFixed(1)} L${x2},${y2} L${h2[0].toFixed(1)},${h2[1].toFixed(1)}`;
}
function labelsLayer(st){
  let out='';
  for(const k of Object.keys(LAB)){
    const id=st[k]; if(NONE.includes(id)) continue;
    const L=LAB[k], t=(L.o&&L.o[id])||L.t, opt=PARTS[k].opts.find(o=>o.id===id); if(!opt) continue;
    const top = L.row==='top', y = top ? LAB_TOP : LAB_BOT;
    // nombre largo: dos renglones cortando en el espacio más cercano al medio
    const lab = opt.label.toLowerCase(); let lines=[lab];
    if(lab.length>11 && lab.includes(' ')){
      let best=-1; for(let i=0;i<lab.length;i++) if(lab[i]===' ' && (best<0 || Math.abs(i-lab.length/2)<Math.abs(best-lab.length/2))) best=i;
      lines=[lab.slice(0,best), lab.slice(best+1)];
    }
    const longest=Math.max(...lines.map(l=>l.length)), fs=Math.min(19, Math.round(19*10/Math.max(10,longest)));
    const sy = top ? y+14+lines.length*fs : y-24;
    out+=`<path d="${arrowPath(L.x,sy,t[0],t[1])}" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
    out+=`<text x="${L.x}" y="${y}" text-anchor="middle" font-family="Gochi Hand, Patrick Hand, sans-serif" font-size="18" fill="${INK}" letter-spacing="1">${CATWORD[k]}</text>`;
    lines.forEach((ln,i)=>{ out+=`<text x="${L.x}" y="${y+19+i*(fs-1)}" text-anchor="middle" font-family="Caveat, Patrick Hand, cursive" font-weight="700" font-size="${fs}" fill="${INK}">${ln}</text>`; });
  }
  return `<g filter="url(#wob)">${out}</g>`;
}

function monster(st, viewBox, opts={}){

  const shadow = '';
  const inner = get('wings',st.wings).draw(x) + `<g transform="translate(206 262) scale(1.15) translate(-206 -262)">${get('tail',st.tail).draw(x)}</g>` + get('horn',st.horn).draw(x) + get('ears',st.ears).draw(x) + get('feet',st.feet).draw(x)
    + bodyLayer(x, st.body) + arms(x) + get('eyes',st.eyes).draw(x) + get('mouth',st.mouth).draw(x);
  // dos pasadas de lapicera: una "fantasma" desplazada detrás, como el trazo repasado del cuaderno
  let pen = opts.shadow===false ? `<g filter="url(#wob)">${inner}</g>` : `<g filter="url(#wob2)" opacity=".5">${inner}</g><g filter="url(#wob)">${inner}</g>`;
  if(col.mono) pen = `<g filter="url(#mono)">${pen}</g>`;
  const labels = opts.labels ? labelsLayer(st) : '';
  const vb = viewBox || (opts.labels ? '-52 -72 404 478' : '-12 2 324 342');
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${defs}<g filter="url(#wob)">${shadow}</g>${labels}<g class="bob">${pen}</g></svg>`;
}

const NH = {roto:'cornio',unicornio:'brillo',espiral:'rulo',doble:'toro',antenas:'bicho',hongo:'hongo',rayo:'rayo',corona:'rey',vela:'cumple',helado:'helado',cresta:'fuego',ninguno:'pancho'};

  return {n:`${NB[st.body]||'Mostri'}${NH[st.horn]||'to'} ${NE[st.eyes]||''}`.trim(), orig:false};
}

  {id:'ciclope', name:'Ciclopín', myth:'el Cíclope', origin:'Grecia', text:'Un gigante con un solo ojo en el medio de la frente. ¡Con un ojo solo ve todo!', horn:'ninguno',ears:'redondas',eyes:'ciclope',mouth:'undiente',body:'peludo',wings:'ninguna',tail:'ninguna',feet:'garras',color:'lila'},
  {id:'kraken', name:'Krakencito', myth:'el Kraken', origin:'Mares del norte de Europa', text:'Un pulpo gigante del fondo del mar. Los marineros contaban que era grande como una isla.', horn:'ninguno',ears:'pez',eyes:'saltones',mouth:'sorpresa',body:'lunares',wings:'aletas',tail:'ninguna',feet:'tentaculos',color:'noche'},
  {id:'grifo', name:'Grifón', myth:'el Grifo', origin:'Grecia', text:'Mitad águila y mitad león. Vuela alto y cuida tesoros de oro.', horn:'ninguno',ears:'punta',eyes:'saltones',mouth:'pico',body:'peludo',wings:'plumas',tail:'leon',feet:'garras',color:'terracota'},
  {id:'loong', name:'Loonguito', myth:'el Dragón chino', origin:'China', text:'Un dragón sin alas que vive en los ríos y las nubes. Es sabio y protege a todos.', horn:'espiral',ears:'punta',eyes:'saltones',mouth:'bigotes',body:'escamas',wings:'ninguna',tail:'dragon',feet:'garras',color:'rojo'},
  {id:'pegaso', name:'Pegasito', myth:'Pegaso', origin:'Grecia', text:'Un caballo con alas que galopa entre las nubes. ¡Es muy veloz!', horn:'ninguno',ears:'crin',eyes:'pestanas',mouth:'sonrisa',body:'liso',wings:'angel',tail:'ninguna',feet:'pezunas',color:'celeste'},
  {id:'coquena', name:'Coquenita', myth:'el Coquena', origin:'La Puna, en el norte de Argentina', text:'Cuida a las vicuñas y a las llamas de la montaña. Se enoja con quien les hace daño.', horn:'ninguno',ears:'conejo',eyes:'saltones',mouth:'undiente',body:'peludo',wings:'ninguna',tail:'ninguna',feet:'pezunas',color:'lapiz'},

  {name:'Nubecita', note:'flota en el cielo', horn:'unicornio',ears:'conejo',eyes:'pestanas',mouth:'sonrisa',body:'nube',wings:'angel',feet:'botas',color:'celeste'},
  {name:'Patopera', note:'nada en la pileta', horn:'ninguno',ears:'hojas',eyes:'saltones',mouth:'pico',body:'pera',wings:'plumas',feet:'pato',color:'amarillo'},
  {name:'Pulpolino', note:'vive en el mar', horn:'hongo',ears:'pez',eyes:'tres',mouth:'sorpresa',body:'lunares',wings:'aletas',feet:'tentaculos',color:'lila'},
  {name:'Trompeta', note:'rey de la fiesta', horn:'corona',ears:'elefante',eyes:'dormilon',mouth:'trompa',body:'liso',wings:'globos',feet:'zapatillas',color:'rosa'},
  {name:'Bichoraro', note:'sabe un montón', horn:'rayo',ears:'murcielago',eyes:'anteojos',mouth:'bigote',body:'cuadritos',wings:'mariposa',feet:'gallina',color:'lima'},
  {name:'Peluchón', note:'abraza fuerte', horn:'helado',ears:'caidas',eyes:'ciclope',mouth:'babosa',body:'peludo',wings:'alita',feet:'resortes',color:'terracota'}

function jitter(str){
  let h=0; for(const ch of str) h=(h*31+ch.charCodeAt(0))>>>0;
  return [...str].map((ch,i)=>{ if(ch===' ') return ' '; h=(h*1103515245+12345)>>>0; const r=((h>>>8)%700)/100-3.5, y=((h>>>4)%5)-2;
    return `<span style="transform:translateY(${y}px) rotate(${r.toFixed(1)}deg)">${ch}</span>`; }).join('');
}

/* ---------- sonido ---------- */
let soundOn = true, actx = null;
function tone(f1,f2,dur,type='square',vol=.06){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const blip = ()=>tone(520+Math.random()*300,900,.09,'triangle',.12);
const boing = ()=>{ tone(180,700,.25,'sine',.18); setTimeout(()=>tone(700,260,.3,'sine',.12),180); };

let state = Object.assign({}, ORIGINAL);

const swatch = c => c.mono ? `repeating-linear-gradient(45deg,#ece7db 0 5px,#24213a 5px 6.5px)` : c.c==='rainbow' ? `linear-gradient(${RAINBOW_STOPS.join(',')})` : c.c;
let showLabels = false;
function fitName(){
  const el=$('tName'); if(!el) return; let fs = innerWidth>=900 ? 76 : (innerHeight<700 ? 44 : 58); el.style.fontSize=fs+'px';
  while(el.scrollWidth>el.clientWidth+1 && fs>15){ fs-=1.5; el.style.fontSize=fs+'px'; }
}
addEventListener('resize', ()=>fitName());
try{ document.fonts && document.fonts.ready.then(()=>fitName()); }catch(e){}
addEventListener('load', ()=>fitName());
function renderStage(){
  $('stage').innerHTML = monster(state, null, {labels:showLabels});
  $('infoBtn').hidden = !state.legend;
  const n = nameOf(state).n, sp = n.indexOf(' ');
  $('tName').innerHTML = jitter(n); requestAnimationFrame(fitName);
  const col = COLORS.find(c=>c.id===state.color) || COLORS[0], cover = document.querySelector('.cover');
  cover.classList.toggle('rb', col.c==='rainbow');
  cover.style.setProperty('--tfill', col.mono ? 'var(--paper)' : (col.c==='rainbow' ? 'transparent' : col.c));
}
function renderTabs(){
  $('tabs').innerHTML = ['color', ...ORDER.filter(k=>k!=='color')].map(k=>{
    const P = PARTS[k];
    const icon = k==='color'
      ? `<span class="sw" style="background:${swatch(COLORS.find(c=>c.id===state.color)||COLORS[0])}"></span>`
      : monster(state, P.crop, {shadow:false});
    return `<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===tab}" data-tab="${k}">${icon}<span>${P.label}</span></button>`;
  }).join('');
}
function renderOpts(){
  requestAnimationFrame(()=>{ const sel=document.querySelector('.opt[aria-pressed="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'center'}); });
  const P = PARTS[tab];
  $('optTitle').textContent = P.label;
  $('opts').innerHTML = P.opts.map(o=>{
    const st = Object.assign({}, state, {[tab]:o.id});
    return `<button class="opt" id="opt-${tab}-${o.id}" aria-pressed="${state[tab]===o.id}" data-opt="${o.id}">${monster(st, P.crop, {shadow:false})}<span>${o.label}</span></button>`;
  }).join('');
}
function renderAll(){ renderStage(); renderTabs(); renderOpts(); }
function popStage(){ const s=$('stage'); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }

$('tabs').addEventListener('click', e=>{
  const b = e.target.closest('[data-tab]'); if(!b) return;
  tab = b.dataset.tab; blip(); renderTabs(); renderOpts();
});
$('opts').addEventListener('click', e=>{
  const b = e.target.closest('[data-opt]'); if(!b) return;
  state[tab] = b.dataset.opt; blip(); renderAll(); popStage();
});

const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function randomState(){ const r={}; ORDER.forEach(k=>{ if(k!=='color') r[k]=pick(PARTS[k].opts).id; }); r.color = state.color; return r; }
let rolling = false;
$('rand').addEventListener('click', ()=>{
  if(rolling) return; rolling = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frames = reduce ? 1 : 9; let i = 0;
  const st = $('stage'); st.classList.add('shake');
  const step = ()=>{
    state = randomState(); renderStage(); tone(300+i*60,320+i*60,.05,'square',.05);
    if(++i < frames) setTimeout(step, 80);
    else { st.classList.remove('shake'); renderAll(); popStage(); boing(); rolling = false; }
  };
  step();
});

/* ---------- compartir (link con el mostro adentro) ---------- */
const SHARE_URL = 'https://claude.ai/artifact/854EQcgPAptEhgYxpNANEM';
$('printBtn').addEventListener('click', ()=>{
  setMenu(false);
  const n = nameOf(state).n;
  $('printArea').innerHTML = `<p class="p-name">${n.replace(/</g,'&lt;')}</p>${monster(state, null, {labels:showLabels})}<p class="p-foot">Mostros Mix</p>`;

// Link a compartir: si la app está publicada en su propio sitio (ej. GitHub Pages) usa esa dirección.
function shareLink(){
  const here = location.protocol.startsWith('http') && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname);
  const base = here ? location.origin + location.pathname : SHARE_URL;
  return base + '#' + encodeState(state);
}
function shareText(){ return `¡Mirá mi mostro ${nameOf(state).n}!`; }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); const ok=document.execCommand('copy'); a.remove(); return ok; }catch(e){ return false; }
}
function openShareBox(){
  const url=shareLink();
  $('sbWa').href='https://wa.me/?text='+encodeURIComponent(shareText()+' 👉 '+url);
  $('shareBox').hidden=false;
}
$('share').addEventListener('click', async ()=>{
  blip && blip();
  const url=shareLink();
  if(navigator.share){
    try{ await navigator.share({title:'Mostros Mix', text:shareText(), url}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  openShareBox();
});
$('sbCopy').addEventListener('click', async ()=>{ const ok=await copyText(shareLink()); $('shareBox').hidden=true; toast(ok?'¡Link copiado!':'No se pudo copiar'); });
$('sbWa').addEventListener('click', ()=>{ $('shareBox').hidden=true; });
$('sbClose').addEventListener('click', ()=>{ $('shareBox').hidden=true; });
$('shareBox').addEventListener('click', e=>{ if(e.target.id==='shareBox') $('shareBox').hidden=true; });
function encodeState(st){
  const data = {p:ORDER.map(k=>Math.max(0,PARTS[k].opts.findIndex(o=>o.id===st[k]))), n:st.name||''};
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  return 'm' + b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeState(tok){
  try{
    if(!tok || tok[0]!=='m') return null;
    let b = tok.slice(1).replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const d = JSON.parse(decodeURIComponent(escape(atob(b))));
    const st = {}; ORDER.forEach((k,i)=>{ const o = PARTS[k].opts[d.p[i]]; st[k] = o ? o.id : PARTS[k].opts[0].id; });
    if(d.n) st.name = String(d.n).slice(0,20);
    return st;
  }catch(e){ return null; }
}


/* ---------- colección ---------- */
const KEY = 'mix-de-mostros-coleccion';
let saved = [];
try{ saved = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ saved = []; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(saved)); }catch(e){} }
function renderShelf(){
  $('shelf').innerHTML = saved.length
    ? saved.map((m,i)=>`<div class="mini"><button data-load="${i}" aria-label="Ver ${nameOf(m).n}">${monster(m)}</button><span>${nameOf(m).n}</span><button class="del" data-del="${i}" aria-label="Sacar de la colección">✕</button></div>`).join('')
    : '<p class="empty">Todavía no guardaste ninguno. ¡Armá uno y tocá Guardar!</p>';
}
$('save').addEventListener('click', ()=>{
  const key = JSON.stringify(state);
  if(!saved.some(m=>JSON.stringify(m)===key)){ saved.unshift(Object.assign({},state)); saved = saved.slice(0,30); persist(); renderShelf(); }
  tone(600,1200,.15,'triangle',.14); setTimeout(()=>tone(900,1500,.15,'triangle',.12),110); popStage();
});
$('shelf').addEventListener('click', e=>{
  const d = e.target.closest('[data-del]');

});

document.fonts && document.fonts.ready.then(fitName);
window.__mostros = {PARTS, ORDER, ORIGINAL, monster, encodeState, decodeState};
state = decodeState(location.hash.slice(1)) || Object.assign(randomState(), {color: pick(COLORS.filter(c=>!c.mono)).id});
renderAll(); renderShelf();
})();
